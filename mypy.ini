; The type gate. Every production root (the four packages' src trees and tools) is checked
; under mypy's default error codes with nothing disabled and strict equality on; the ten
; codes below are disabled for tests alone, whose bodies stay checked (check_untyped_defs) but
; keep their grandfathering until a family takes them on. The production tree was brought
; under the full gate module by module in the remediation program and measured clean as a
; whole before the per-module sections retired, so a new production module is under the full
; gate from its first line.
;
; The files list below is the one source of the gate's roots; CI and gate_baseline.py invoke
; bare `mypy` from the repo root against it. `mypy .` instead dies on a module-name clash,
; because tools are both run directly and imported as tools.<name> from tests;
; explicit_package_bases resolves both identities from the repo root. Partial invocations are
; supported from the repo root only, and a run naming only some files as arguments resolves
; their imports through the environment's editable install rather than the tree, so the
; whole-tree run is the gate.
[mypy]
files =
    packages/tcip-store/src,
    packages/tcip-annotation/src,
    packages/tcip-mcp/src,
    packages/tcip-web/src,
    tools,
    tests
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = False
namespace_packages = True
explicit_package_bases = True
check_untyped_defs = True
strict_equality = True

; tests/ keeps its grandfathering in its own section: the ten codes the production gate holds
; to are disabled here only, so a test body is still checked for everything else.
[mypy-tests,tests.*]
disable_error_code =
    attr-defined,
    union-attr,
    arg-type,
    assignment,
    operator,
    index,
    valid-type,
    var-annotated,
    return-value,
    misc

