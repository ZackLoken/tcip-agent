; Permissive phase-0 type gate. A full strict pass would surface a large pre-existing cleanup
; with per-site judgment calls, so this gate grandfathers the ten error codes below and stays
; live for everything else, most valuably call-arg (calling a function with the wrong number
; or names of arguments), a class ruff does not catch. It is the seam to tighten: re-enable
; one grandfathered code at a time (start with union-attr, the latent None-deref class) as the
; sites are fixed.
;
; The files list below is the one source of the gate's roots; CI and gate_baseline.py invoke
; bare `mypy` from the repo root against it. `mypy .` instead dies on a module-name clash,
; because scripts are both run directly and imported as scripts.<name> from tests;
; explicit_package_bases resolves both identities from the repo root. Partial invocations are
; supported from the repo root only.
; check_untyped_defs keeps test bodies checked, where most of the suite's logic lives.
; Known unchecked seam: scripts importing _paths as a top-level module resolve it to Any.
[mypy]
files =
    packages/tcip-store/src,
    packages/tcip-annotation/src,
    packages/tcip-mcp/src,
    packages/tcip-web/src,
    scripts,
    tests
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = False
namespace_packages = True
explicit_package_bases = True
check_untyped_defs = True
disable_error_code =
    attr-defined,
    union-attr,
    arg-type,
    assignment,
    operator,
    index,
    valid-type,
    var-annotated,
    return-value,
    misc

; A module worked in the remediation program takes the ten codes back, module by module, as its
; own seam is fixed. Nothing global changes: a section here holds only what it names, and a
; module is listed only once it is measured clean, so the gate holds rather than aspires. The
; remaining tree stays grandfathered until its own turn.

