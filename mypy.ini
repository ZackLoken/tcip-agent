; The type gate. Every production root (the four packages' src trees and scripts) is checked
; under mypy's default error codes with nothing disabled; the ten codes below are disabled for
; tests alone, whose bodies stay checked (check_untyped_defs) but keep their grandfathering
; until a family takes them on. The production tree was brought under the full gate module by
; module in the remediation program and measured clean as a whole before the per-module
; sections retired, so a new production module is under the full gate from its first line.
;
; The files list below is the one source of the gate's roots; CI and gate_baseline.py invoke
; bare `mypy` from the repo root against it. `mypy .` instead dies on a module-name clash,
; because scripts are both run directly and imported as scripts.<name> from tests;
; explicit_package_bases resolves both identities from the repo root. Partial invocations are
; supported from the repo root only, and a run naming only some files as arguments resolves
; their imports through the environment's editable install rather than the tree, so the
; whole-tree run is the gate.
; Known unchecked seam: scripts importing _paths as a top-level module resolve it to Any.
[mypy]
files =
    packages/tcip-store/src,
    packages/tcip-annotation/src,
    packages/tcip-mcp/src,
    packages/tcip-web/src,
    scripts,
    tests
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = False
namespace_packages = True
explicit_package_bases = True
check_untyped_defs = True

; tests/ keeps its grandfathering in its own section: the ten codes the production gate holds
; to are disabled here only, so a test body is still checked for everything else.
[mypy-tests,tests.*]
disable_error_code =
    attr-defined,
    union-attr,
    arg-type,
    assignment,
    operator,
    index,
    valid-type,
    var-annotated,
    return-value,
    misc

; Modules that opted into strict equality keep it; the ten codes need no section now.

[mypy-tcip_annotation.verdicts]
strict_equality = True

[mypy-tcip_mcp.pipelines.feedback.verdicts]
strict_equality = True

[mypy-tcip_mcp.tools.operationalization_tools]
strict_equality = True

[mypy-tcip_annotation.review_engine]
strict_equality = True

[mypy-tcip_web.app]
strict_equality = True

[mypy-tcip_web.routes.dataset]
strict_equality = True

[mypy-tcip_mcp.web_client]
strict_equality = True

[mypy-tcip_web.jobstore]
strict_equality = True

[mypy-tcip_web.agent_bash_guard]
strict_equality = True

[mypy-tcip_web.agent_fence_rules]
strict_equality = True

[mypy-scripts.gate_baseline]
strict_equality = True

[mypy-tcip_web.__main__]
strict_equality = True

[mypy-tcip_mcp.dataset_layout]
strict_equality = True

[mypy-scripts.doctor]
strict_equality = True
