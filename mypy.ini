; Permissive phase-0 type gate (audit L8). A full type pass surfaces 118 pre-existing issues
; across the three packages (union-attr None-derefs, attr-defined on dynamic torch attrs, arg-type,
; assignment, ...): a real cleanup with per-site judgment calls, tracked to tighten incrementally.
;
; So this gate GRANDFATHERS those 13 error codes for now and stays LIVE for the classes ruff can't
; catch: most valuably `call-arg` (calling a function with the wrong number/names of arguments),
; plus name-defined / import / no-redef / return / syntax. It catches real regressions today and is
; the seam to tighten: re-enable one grandfathered code at a time (start with `union-attr`, the
; latent None-deref class) as the sites are fixed.
[mypy]
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = False
disable_error_code =
    attr-defined,
    union-attr,
    arg-type,
    assignment,
    operator,
    index,
    valid-type,
    var-annotated,
    return-value,
    misc
