# What environment.yml resolved on a fresh Linux machine: a condaforge/miniforge3 container
# (Ubuntu 24.04, x86_64) ran `conda env create -f environment.yml` on a clean archive of the
# tree and `conda env export -n tcip-agent --no-builds` wrote this. A record of one resolution,
# kept beside the Windows export so a Linux adopter can compare what resolved for them; the
# four tcip-* lines are the editable installs, so this file is never itself a path to create an
# environment. Regenerate it the same way after a change
# to environment.yml.
