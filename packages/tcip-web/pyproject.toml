[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcip-web"
version = "0.1.0"
description = "FastAPI web server for TCIP ML pipeline: REST API + WebSocket for training progress"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "tcip-mcp",
    "tcip-store",
    "tcip-annotation",
    # A run's board path is forwarded to the TensorBoard serving it: httpx sends, werkzeug names
    # the hop-by-hop headers left behind.
    "httpx",
    "werkzeug",
    # ConPTY backend for the embedded agent terminal (POSIX uses the stdlib pty).
    "pywinpty>=3.1.1; sys_platform == 'win32'",
    # The Windows terminal backend waits for its terminated process through psutil.
    "psutil>=5.9",
]

[project.scripts]
tcip = "tcip_web.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tcip_web"]
# The frontend build's output, which the repository's .gitignore ignores.
artifacts = ["src/tcip_web/static/"]
