[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcip-web"
version = "0.1.0"
description = "FastAPI web server for TCIP ML pipeline: REST API + WebSocket for training progress"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "tcip-mcp",
    # The storage seam is declared here rather than inherited through tcip-mcp: a package
    # declares the layers it uses directly.
    "tcip-store",
    # Same reasoning: the routes import the annotation package's label reader, geometry
    # (BBox/Point/Polygon, routes/annotate.py:17), state, and verdict types directly.
    "tcip-annotation",
    # ConPTY backend for the embedded agent terminal (POSIX uses the stdlib pty).
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["httpx", "pytest", "pytest-asyncio", "pytest-cov"]

[project.scripts]
tcip = "tcip_web.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tcip_web"]
