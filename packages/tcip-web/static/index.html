<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCIP Pipeline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1e1e2e; color: #cdd6f4; }
    header { background: #313244; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 20px; font-weight: 600; }
    .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card { background: #313244; border-radius: 8px; padding: 20px; }
    .card h2 { font-size: 16px; margin-bottom: 12px; color: #89b4fa; }
    .card p { font-size: 14px; color: #a6adc8; line-height: 1.5; }
    .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .status.ok { background: #a6e3a1; color: #1e1e2e; }
    .status.error { background: #f38ba8; color: #1e1e2e; }
    #project-status { margin-top: 8px; }
    button { background: #89b4fa; color: #1e1e2e; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background: #74c7ec; }
    pre { background: #1e1e2e; padding: 12px; border-radius: 4px; overflow-x: auto; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>TCIP Pipeline</h1>
    <span id="health-status" class="status">checking...</span>
  </header>

  <div class="container">
    <div class="grid">
      <div class="card">
        <h2>Project Status</h2>
        <button onclick="loadStatus()">Refresh</button>
        <pre id="project-status">Click refresh to load...</pre>
      </div>

      <div class="card">
        <h2>Experiments</h2>
        <button onclick="loadExperiments()">List</button>
        <pre id="experiments-list">Click list to load...</pre>
      </div>

      <div class="card">
        <h2>Training Runs</h2>
        <button onclick="loadTraining()">List</button>
        <pre id="training-list">Click list to load...</pre>
      </div>

      <div class="card">
        <h2>Components</h2>
        <button onclick="loadComponents()">List</button>
        <pre id="components-list">Click list to load...</pre>
      </div>
    </div>
  </div>

  <script>
    // Health check
    fetch('/health')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        var el = document.getElementById('health-status');
        el.textContent = d.status;
        el.className = 'status ' + (d.status === 'ok' ? 'ok' : 'error');
      })
      .catch(function() {
        var el = document.getElementById('health-status');
        el.textContent = 'offline';
        el.className = 'status error';
      });

    function loadStatus() {
      fetch('/api/project/status')
        .then(function(r) { return r.json(); })
        .then(function(d) { document.getElementById('project-status').textContent = JSON.stringify(d, null, 2); })
        .catch(function(e) { document.getElementById('project-status').textContent = 'Error: ' + e.message; });
    }

    function loadExperiments() {
      fetch('/api/experiments')
        .then(function(r) { return r.json(); })
        .then(function(d) { document.getElementById('experiments-list').textContent = JSON.stringify(d, null, 2); })
        .catch(function(e) { document.getElementById('experiments-list').textContent = 'Error: ' + e.message; });
    }

    function loadTraining() {
      fetch('/api/training')
        .then(function(r) { return r.json(); })
        .then(function(d) { document.getElementById('training-list').textContent = JSON.stringify(d, null, 2); })
        .catch(function(e) { document.getElementById('training-list').textContent = 'Error: ' + e.message; });
    }

    function loadComponents() {
      fetch('/api/components')
        .then(function(r) { return r.json(); })
        .then(function(d) { document.getElementById('components-list').textContent = JSON.stringify(d, null, 2); })
        .catch(function(e) { document.getElementById('components-list').textContent = 'Error: ' + e.message; });
    }
  </script>
</body>
</html>
