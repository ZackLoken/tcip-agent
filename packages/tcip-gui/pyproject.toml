[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcip-gui"
version = "0.1.0"
description = "PyQt6 desktop shell for TCIP agent"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.5",
    "PyQt6-WebEngine>=6.5",
]

[project.scripts]
tcip-gui = "tcip_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
