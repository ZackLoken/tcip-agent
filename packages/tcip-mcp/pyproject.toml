[project]
name = "tcip-mcp"
version = "0.1.0"
description = "MCP server exposing TCIP phenotyping domain tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2",
    "pyyaml>=6.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=1.0",
    "numpy",
    "pillow>=9.0",
    "tifffile>=2023.1",
    "imagecodecs>=2023.1",
    "pyproj>=3.5",
    "shapely>=2.0",
    "pycocotools>=2.0.7",
    "pydantic>=2",
    "filelock>=3.0",
    "tcip-annotation",
]

[project.optional-dependencies]
hpo = ["ray[tune]>=2.9", "optuna>=3.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-timeout>=2.0", "pytest-xdist>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcip_mcp"]
