[project]
name = "tcip-mcp"
version = "0.1.0"
description = "MCP server exposing TCIP phenotyping domain tools"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2",
    "pyyaml>=6.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=1.0",
    "numpy",
    "pillow>=9.0",
    "tifffile>=2023.1",
    "imagecodecs>=2023.1",
    # Bundles its own GDAL and ships wheels for every supported platform, so no osgeo binding.
    "rasterio>=1.4",
    "pyproj>=3.5",
    "shapely>=2.0",
    "pycocotools>=2.0.7",
    "pydantic>=2",
    "tcip-store",
    "tcip-annotation",
    # torch.utils.tensorboard.SummaryWriter and tensorboard_manager both need this installed.
    "tensorboard>=2.14",
    "psutil>=5.9",
]

[project.optional-dependencies]
# [default] adds the dashboard's own deps (aiohttp, grpcio); hpo._ray_session only requests it when importable.
hpo = ["ray[default,tune]>=2.9", "optuna>=3.0", "hyperopt", "bayesian-optimization",
       "nevergrad", "ax-platform"]
# fiona is the vector reader tcip_mcp.cli.shp_to_plant_csv uses; no shipped module imports it
# at runtime, so it belongs here rather than the runtime deps.
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-timeout>=2.0", "pytest-xdist>=3.0",
       "fiona>=1.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcip_mcp"]
