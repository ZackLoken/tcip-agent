[project]
name = "tcip-mcp"
version = "0.1.0"
description = "MCP server exposing TCIP phenotyping domain tools"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2",
    "pyyaml>=6.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=1.0",
    "numpy",
    # scipy.spatial, read by the band-group identity tolerance and the nearest-neighbor spacing,
    # and scipy.stats.median_abs_deviation, read by the row-break derivation.
    "scipy",
    # sklearn.metrics.metric_at_thresholds (added in 1.9), read by the mask threshold derivation.
    "scikit-learn>=1.9",
    "pillow>=13.0",
    "tifffile>=2023.1",
    "imagecodecs>=2023.1",
    # Bundles its own GDAL and ships wheels for every supported platform, so no osgeo binding.
    "rasterio>=1.4",
    "pyproj>=3.5",
    "shapely>=2.0",
    # Same GDAL-wheel bundling as rasterio, for plant_mapping.read_plant_shapefile and the
    # shp_to_plant_csv tool built over it.
    "fiona>=1.9",
    "pycocotools>=2.0.7",
    # cv2, read by the derivations, the slice lattice and the raster source.
    "opencv-python>=4.12.0.88",
    # Tiled inference: the slice lattice, the detection-model wrapper and the cross-tile merge.
    "sahi>=0.12.6",
    # The sam and grounding_dino proposal engines: their models, processors and checkpoints.
    "transformers>=5",
    "pydantic>=2",
    # web_client's pushes to the tcip-web backend: httpx sends them.
    "httpx",
    "tcip-store",
    "tcip-annotation",
    # torch.utils.tensorboard.SummaryWriter and tensorboard_manager both need this installed.
    "tensorboard>=2.14",
    "psutil>=5.9",
]

[project.optional-dependencies]
# [default] adds the dashboard's own deps (aiohttp, grpcio); hpo._ray_session only requests it when importable.
# bayesian-optimization<2: Ray Tune's BayesOptSearch (2.58) calls bayes_opt.UtilityFunction, removed in 2.0.
hpo = ["ray[default,tune]>=2.9", "optuna>=3.0", "hyperopt", "bayesian-optimization<2"]
# ruff and mypy pinned: ruff.toml runs pycodestyle's preview rules, which move between releases,
# and a mypy release can redefine the gate's module discovery.
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.0",
    "ruff==0.16.8",
    "mypy==2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcip_mcp"]
