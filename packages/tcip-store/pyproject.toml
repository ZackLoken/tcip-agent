[project]
name = "tcip-store"
version = "0.1.0"
description = "Storage seam: one interface for TCIP's mutable records, append-only logs, and blobs"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcip_store"]
