[project]
name = "tcip-annotation"
version = "0.1.0"
description = "Headless annotation and review engine: per-image JSON and COCO label I/O, IoU matching, SAM-assisted labeling"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.5",
    "pillow>=9.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
sam = [
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git",
    "torch>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tcip_annotation"]
