[project]
name = "tcip-annotation"
version = "0.1.0"
description = "Headless annotation and review engine for YOLO-format data"
requires-python = ">=3.10"
dependencies = [
    "pillow>=9.0",
    "shapely>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcip_annotation"]
