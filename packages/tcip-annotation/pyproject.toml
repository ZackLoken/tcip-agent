[project]
name = "tcip-annotation"
version = "0.1.0"
description = "Headless annotation and review engine: per-image JSON and COCO label I/O, IoU matching"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.12.0.88",
    "pillow>=9.0",
    "shapely>=2.0",
    "tcip-store",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcip_annotation"]
