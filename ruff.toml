# Repo-wide ruff config (CI-enforced via .github/workflows/ci.yml). Rule set = E4/E7/E9 + F
# (imports, syntax, pyflakes) + B033. Line length is not enforced (E501 not selected), to match the existing code style.

[lint]
# The rule set is selected explicitly, never left to ruff's implicit default, which moves
# between ruff releases; this config's meaning is fixed by this line alone.
select = ["E4", "E7", "E9", "F", "B033"]
ignore = [
    "E741",  # ambiguous one-letter names (l/I/O): low value, mostly in tests
]

[lint.per-file-ignores]
# `name = pytest.importorskip("dep")` legitimately precedes imports in dependency-gated
# test files, which would otherwise trip E402 (module import not at top of file).
"tests/**" = ["E402"]
