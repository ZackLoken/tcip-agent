# The lint gate: CI runs `ruff check .`, a developer `ruff check packages tests tools`.
# The code follows PEP 8 strictly and this gate enforces it.

# Selected explicitly, never ruff's implicit default, which moves between releases; the preview
# rules move too, so .github/workflows/ci.yml pins the ruff version this file was written against.

# 100 columns: where the tree sat when the gate was written and the length the reformatting was
# first measured at. Provisional until the owner rules on 79, 88 or 100.
line-length = 100

[lint]
# pycodestyle's whitespace, blank-line and warning rules (E1, E2, E3, W) are preview rules in ruff.
preview = true

# E, W: pycodestyle, PEP 8's layout rules, line length included. N: pep8-naming, PEP 8's naming.
# F: pyflakes. B033: a duplicate set value. D, I, UP, SIM, C4 and the formatter are later gates.
select = ["E", "W", "N", "F", "B033"]
ignore = [
    # Exceptions are named for the refusal they are (`AssessmentRefused`, `NoActor`); an `Error`
    # suffix on 53 shared names carries nothing. Provisional until the owner rules.
    "N818",
    # `torch.nn.functional as F` is PyTorch's own documented alias. Provisional until the owner rules.
    "N812",
]

[lint.per-file-ignores]
# `name = pytest.importorskip("dep")` legitimately precedes imports in dependency-gated test
# files, which would otherwise trip E402 (module import not at top of file).
"tests/**" = ["E402"]
