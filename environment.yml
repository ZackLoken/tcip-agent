# Platform-agnostic conda environment for TCIP Agent, created as README.md's Setup states.
#
# This installs conda-managed Python + Node, then via pip the four local packages, editable,
# with the dependencies and extras each declares. Run it from the
# repository root so the editable paths resolve.
#
# torch is the +cpu build while the CPU index and PyPI carry the same newest release; on macOS pip
# resolved torch-2.15.0-cp313-cp313-macosx_14_0_arm64.whl, no +cpu tag. CUDA: README.md's Setup.
name: tcip-agent
channels:
  - conda-forge
dependencies:
  # One version by choice, for a reproducible environment; the packages themselves take >=3.12.
  # Not 3.14 yet: fiona publishes no stable 3.14 wheel.
  - python=3.13.*
  - nodejs==22.23.4
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - -e ./packages/tcip-store
      - -e ./packages/tcip-annotation
      - -e ./packages/tcip-mcp[dev,hpo]
      - -e ./packages/tcip-web
variables:
  PYTHONUTF8: "1"
