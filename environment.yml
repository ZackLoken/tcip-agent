# Platform-agnostic conda environment for TCIP Agent.
#
#   conda env create -f environment.yml
#   conda activate tcip-agent
#
# This installs conda-managed Python + Node, then the project's third-party
# dependencies and the four local packages (editable) via pip. Run it from the
# repository root so the editable paths resolve.
#
# GPU note: defaults to the CUDA build (cu126) via --extra-index-url below; it runs fine without a GPU too, since every device placement here branches on torch.cuda.is_available(). CI installs its own separate CPU wheel (.github/workflows/ci.yml), unaffected by this.
#
# environment.win.lock.yml is a frozen export from one Windows machine, taken before this
# file's Node and OpenCV corrections; it is kept only for the mypy pin its CI comment cites, never as a path to create an environment. environment.linux.lock.yml is the same kind of
# export from a fresh Linux container, a record of what resolved there.
name: tcip-agent
channels:
  - conda-forge
dependencies:
  # One version by choice, for a reproducible environment; the packages themselves take >=3.11.
  - python=3.12.*
  - nodejs>=22.9,<23  # npm 11 supports node ^20.17.0 || >=22.9.0; unpinned, conda-forge resolved a v26 alpha build it refuses
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      # --- core runtime ---
      - mcp>=2
      - numpy
      - pillow>=9.0
      - tifffile>=2023.1
      - imagecodecs>=2023.1  # LZW/JPEG decode for compressed multi-band GeoTIFF (e.g. a drone orthomosaic)
      # rasterio bundles its own GDAL and ships wheels for every platform this runs on, so no separate osgeo binding, no system libgdal, and no pinned third-party wheel.
      - rasterio>=1.4
      - fiona>=1.9  # vector side of the same stack, for tcip_mcp.cli.shp_to_plant_csv
      - pyproj>=3.5
      - shapely>=2.0
      - pyyaml>=6.0
      - torch>=2.2
      - torchvision>=0.17
      - timm>=1.0
      - opencv-python-headless>=4.5  # the platform is headless; the GUI wheel needs X libraries a fresh Linux machine lacks
      - scikit-image>=0.22
      - pycocotools>=2.0.7
      - psutil>=5.9  # read-only host CPU/RAM visibility for scripts/inspect_compute_resources.py
      # --- web backend ---
      - fastapi>=0.115.0
      - uvicorn[standard]>=0.30.0
      # --- training telemetry ---
      # torch.utils.tensorboard's SummaryWriter needs this, and it is the server the
      # tensorboard_manager launches for a run's or a sweep's logdir.
      - tensorboard>=2.14
      # --- hyperparameter optimization (Ray Tune, lazy-imported) ---
      # Ray drives the sweep; search-algorithm backends are agent-selectable and each
      # degrades gracefully if absent. Installed via pip (Ray on Windows is pip-only).
      # [default] pulls in the dashboard's own dependencies (aiohttp, grpcio, ...), which
      # tune_search enables so the Tuning tab can embed it for a running sweep.
      - ray[default,tune]>=2.9
      - optuna>=3.0
      - hyperopt
      - bayesian-optimization
      - nevergrad
      - ax-platform
      # --- dev / test ---
      - pytest>=7.0
      - pytest-asyncio>=0.21
      - pytest-timeout
      - pytest-xdist
      - httpx
      - ruff
      - mypy==2.2.0  # pinned to the version CI's type gate installs
      - pypdf>=4.0  # verify_citations.py extracts a paper's text to check its quote appears verbatim
      # --- SAM-assisted labeling ---
      # Not on PyPI: distribution `sam-2`, import path `sam2`, built against the torch entry above. Pinned to the commit a working environment resolves; move it with pip freeze in a working environment and copy its sam-2 line here.
      - sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4
      # --- local packages (editable; run from repo root) ---
      - -e ./packages/tcip-store
      - -e ./packages/tcip-annotation
      - -e ./packages/tcip-mcp
      - -e ./packages/tcip-web
