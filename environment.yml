# Platform-agnostic conda environment for TCIP Agent.
#
#   conda env create -f environment.yml
#   conda activate tcip-agent
#
# This installs conda-managed Python + Node, then the project's third-party
# dependencies and the three local packages (editable) via pip. Run it from the
# repository root so the editable paths resolve.
#
# GPU note: this installs the default CPU/-or-platform torch wheel from PyPI,
# which works everywhere. For a CUDA build, install torch/torchvision separately from a
# CUDA index — the wheel bundles its own CUDA runtime, so only a recent NVIDIA driver is
# needed (no system CUDA toolkit). Pick the index by desired torch version, not vice-versa:
#   cu126 carries the newest torch (recommended):
#     pip install torch torchvision --index-url https://download.pytorch.org/whl/cu126
#   (cu124 is an older index capped at torch 2.6.0; cu130 is the bleeding-edge CUDA 13 runtime.)
# CI installs the explicit CPU wheel (see .github/workflows/ci.yml).
#
# The exact Windows lockfile that this replaced is kept as environment.win.lock.yml
# for reproducing one known-good machine; it is not portable.
name: tcip-agent
channels:
  - conda-forge
dependencies:
  - python>=3.11,<3.13
  - nodejs>=20
  - pip
  - pip:
      # --- core runtime ---
      - mcp>=2
      - numpy
      - pillow>=9.0
      - tifffile>=2023.1
      - shapely>=2.0
      - pyyaml>=6.0
      - torch>=2.2
      - torchvision>=0.17
      - timm>=1.0
      - opencv-python>=4.5
      - scikit-image>=0.22
      - pycocotools>=2.0.7
      - psutil>=5.9  # read-only host CPU/RAM visibility for inspect_compute_resources (K24)
      # --- web backend ---
      - fastapi>=0.115.0
      - uvicorn[standard]>=0.30.0
      # --- hyperparameter optimization (Ray Tune, lazy-imported) ---
      # Ray drives the sweep; search-algorithm backends are agent-selectable and each
      # degrades gracefully if absent. Installed via pip (Ray on Windows is pip-only).
      - ray[tune]>=2.9
      - optuna>=3.0
      - hyperopt
      - bayesian-optimization
      - nevergrad
      - ax-platform
      - zoopt
      - ConfigSpace
      - hpbandster
      # hebo (HEBOSearch) is intentionally omitted: it fails to build on Windows/Py3.12
      # (its pinned numpy needs the removed pkgutil.ImpImporter). Ray runs fine without it.
      # --- dev / test ---
      - pytest>=7.0
      - pytest-asyncio>=0.21
      - pytest-timeout
      - httpx
      - ruff
      # --- SAM-assisted labeling (optional) ---
      # The SAM2 wrapper degrades gracefully if this is absent. Install when you
      # need sam_predict / generate_mask_candidates; the distribution is finicky to pin
      # cross-platform, so it is intentionally left out of the default solve:
      #   pip install "sam-2"   # imported as `sam2`
      # --- local packages (editable; run from repo root) ---
      - -e ./packages/tcip-annotation
      - -e ./packages/tcip-mcp
      - -e ./packages/tcip-web
