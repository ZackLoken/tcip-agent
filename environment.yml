# Platform-agnostic conda environment for TCIP Agent.
#
#   conda env create -f environment.yml
#   conda activate tcip-agent
#
# This installs conda-managed Python + Node, then via pip the four local packages, editable,
# with the dependencies and extras each declares. Run it from the
# repository root so the editable paths resolve.
#
# GPU note: the CUDA build (cu130) via --extra-index-url below. That index has no current macOS
# build, so on a Mac pip takes PyPI's torch, which runs on Apple's GPU (MPS). An unstated device
# places on CUDA, else MPS, else the CPU, so the environment runs without a GPU too. CI installs
# its own CPU wheel.
name: tcip-agent
channels:
  - conda-forge
dependencies:
  # One version by choice, for a reproducible environment; the packages themselves take >=3.12.
  # Not 3.14 yet: fiona publishes no stable 3.14 wheel.
  - python=3.13.*
  - nodejs==22.23.4
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - -e ./packages/tcip-store
      - -e ./packages/tcip-annotation
      - -e ./packages/tcip-mcp[dev,hpo]
      - -e ./packages/tcip-web
variables:
  PYTHONUTF8: "1"
