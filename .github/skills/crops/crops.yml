# TCIP crop trait definitions — controlled vocabulary.
#
# GROUND TRUTH, breeder-defined: trait name, definition, format, units, and which crops
# carry each trait. Verify traits against this file before asserting one exists.
#
# Deliberately EXCLUDED: any CV method / task / categorization (image perspective, sensor
# type, isolation task, ml task, category, automatable flag). Those were model-generated
# guesses in the source catalog, not expert truth. The measurement approach for a trait is
# derived and validated per trait against real imagery — never fixed here.
#
# 180 traits across 6 crops: black_locust, chestnut, currant, elderberry, hazelnut, persimmon.

