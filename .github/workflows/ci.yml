name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The only job that reads environment.yml. The pip jobs below install their own set, so without
  # this a break in the documented install reaches an adopter before it reaches CI.
  environment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: tcip-agent
          auto-activate-base: false

      - name: Report what resolved
        run: |
          python --version
          python -c "import rasterio, fiona, pyproj; print('rasterio', rasterio.__version__, 'gdal', rasterio.__gdal_version__); print('fiona', fiona.__version__)"

      - name: The raster stack works in the documented environment
        run: pytest tests/test_raster_source.py tests/test_overviews.py tests/test_band_stats.py -q

  # mypy runs as its own job so its ~2-3 min stays off the pytest critical path.
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: pip-${{ runner.os }}-

      # mypy invalidates individual file entries itself, so restoring the closest prior run's
      # cache is always safe, never stale.
      - uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ github.sha }}
          restore-keys: mypy-${{ runner.os }}-

      - name: Install CPU-only torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install packages
        run: |
          # mypy pinned to the version environment.win.lock.yml resolves, so a mypy release
          # cannot silently redefine the gate's module discovery.
          pip install mypy==2.2.0
          pip install -e packages/tcip-store
          pip install -e packages/tcip-annotation
          pip install -e "packages/tcip-mcp[dev,hpo]"
          pip install -e "packages/tcip-web[dev]"

      - name: Type check (mypy; see mypy.ini)
        # bare mypy: the roots come from mypy.ini's files list, the single source.
        run: mypy

  python:
    runs-on: ubuntu-latest
    strategy:
      # Both storage backends stay gated: sqlite is the default, file is the
      # zero-service fallback an operator can still select.
      fail-fast: false
      matrix:
        store-backend: ["sqlite", "file"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install CPU-only torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install packages
        run: |
          pip install pytest-timeout pytest-xdist ruff
          pip install -e packages/tcip-store
          pip install -e packages/tcip-annotation
          pip install -e "packages/tcip-mcp[dev,hpo]"
          pip install -e "packages/tcip-web[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: ARCHITECTURE.md matches the tree
        # The adopter-facing map must not drift from the code: every module-table path exists,
        # and its import/imported-by counts match a freshly generated inventory.
        run: |
          python scripts/build_module_inventory.py --out module-inventory.json
          python scripts/check_architecture_doc.py --inventory-json module-inventory.json

      - name: ARCHITECTURE.md citations match what they quote
        # Every citation that quotes a line must still find that line in the file it names.
        run: python scripts/check_architecture_citations.py

      - name: Run tests
        # TCIP_MIN_TESTS guards against the "missing dep silently skips ~15 files,
        # CI still green" mode; see tests/conftest.py and tests/test_core_deps.py.
        # -n auto: pytest-xdist parallelism (parallel-safe; scales to the runner's cores).
        # OMP_NUM_THREADS=1 pairs with the torch single-thread fixture so workers don't
        # oversubscribe. --timeout=300 caps thermal-throttle outliers without slowing the gate.
        env:
          TCIP_MIN_TESTS: "400"
          OMP_NUM_THREADS: "1"
          TCIP_STORE_BACKEND: ${{ matrix.store-backend }}
        run: pytest tests/ -n auto --timeout=300 -q

  # test_hpo_ray_detached_exit.py's console-signal exit path is Windows-only (skipif everywhere
  # else), so it never rides the ubuntu python job's matrix; this job is its only CI coverage.
  ray-exit-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: tcip-agent
          auto-activate-base: false

      - name: The detached Ray exit path leaves no daemon behind
        run: |
          set -o pipefail
          pytest tests/test_hpo_ray_detached_exit.py -q --timeout=600 | tee ray-exit-windows-output.txt

      - name: Prove the file's one Windows-only test actually ran and passed, not skipped away
        run: |
          grep -qE "^1 passed" ray-exit-windows-output.txt || {
            echo "the file's one test did not pass (skipped, or none selected): a widened skip"
            echo "condition would leave this job green with nothing proven; failing it instead"
            exit 1
          }

  # The documented container path (packages/tcip-web/Dockerfile) is built and answers here, so a
  # broken image reaches CI before an adopter.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f packages/tcip-web/Dockerfile -t tcip-web:ci .

      - name: Import smoke (the system libs the slim base doesn't ship)
        run: docker run --rm tcip-web:ci python -c "import cv2, rasterio, torch, tcip_web"

      - name: Run and poll for the GUI
        run: |
          docker run --network host -d --name tcip-web-ci tcip-web:ci
          for _ in $(seq 1 60); do
            code=$(curl -s -o response.txt -w "%{http_code}" http://127.0.0.1:8765/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "status: $code"
          head -c 200 response.txt
          docker stop tcip-web-ci
          [ "$code" = "200" ]

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: packages/tcip-web/frontend
        run: npm ci --no-fund --no-audit

      - name: Format check
        working-directory: packages/tcip-web/frontend
        run: npm run format:check

      - name: Lint
        working-directory: packages/tcip-web/frontend
        run: npm run lint

      - name: Type check
        working-directory: packages/tcip-web/frontend
        run: npm run typecheck

      - name: Test
        working-directory: packages/tcip-web/frontend
        run: npm test

      - name: Build
        working-directory: packages/tcip-web/frontend
        run: npm run build
