name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install packages
        run: |
          pip install pytest-timeout ruff
          pip install -e packages/tcip-annotation
          pip install -e "packages/tcip-mcp[dev,hpo]"
          pip install -e "packages/tcip-web[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        # TCIP_MIN_TESTS guards against the "missing dep silently skips ~15 files,
        # CI still green" mode — see tests/conftest.py and tests/test_core_deps.py.
        env:
          TCIP_MIN_TESTS: "400"
        run: pytest tests/ --timeout=120 -v

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: packages/tcip-web/frontend
        run: npm ci --no-fund --no-audit

      - name: Lint
        working-directory: packages/tcip-web/frontend
        run: npm run lint

      - name: Type check
        working-directory: packages/tcip-web/frontend
        run: npm run typecheck

      - name: Test
        working-directory: packages/tcip-web/frontend
        run: npm test

      - name: Build
        working-directory: packages/tcip-web/frontend
        run: npm run build
