name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install packages
        run: |
          pip install -e packages/tcip-annotation
          pip install -e "packages/tcip-mcp[dev]"

      - name: Run tests
        run: pytest tests/ -x --timeout=120 -v

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: packages/tcip-vscode
        run: npm ci

      - name: Type check
        working-directory: packages/tcip-vscode
        run: npx tsc --noEmit
