name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # mypy runs as its own job so its ~2-3 min stays off the pytest critical path.
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pip's cache keys wheels by exact version, so a runner-image libgdal bump (a new
      # gdal==X pin) misses the cache and rebuilds; nothing stale can be served.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: pip-${{ runner.os }}-

      # mypy's own incremental cache; mypy invalidates individual file entries itself, so
      # restoring the closest prior run's cache is always safe, never stale.
      - uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ github.sha }}
          restore-keys: mypy-${{ runner.os }}-

      - name: Install CPU-only torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install GDAL (system libgdal + version-matched bindings; PyPI gdal has no wheels)
        # Preinstalled numpy + --no-build-isolation: an isolated build omits the gdal_array
        # numpy bridge, which fails only at runtime (_gdal_array ImportError).
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgdal-dev
          pip install numpy setuptools wheel
          pip install "gdal==$(gdal-config --version)" --no-build-isolation

      - name: Install packages
        run: |
          pip install mypy
          pip install -e packages/tcip-annotation
          pip install -e "packages/tcip-mcp[dev,hpo]"
          pip install -e "packages/tcip-web[dev]"

      - name: Type check (mypy, permissive; see mypy.ini)
        run: mypy packages/tcip-annotation/src packages/tcip-mcp/src packages/tcip-web/src

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pip's cache keys wheels by exact version, so a runner-image libgdal bump (a new
      # gdal==X pin) misses the cache and rebuilds; nothing stale can be served.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install CPU-only torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install GDAL (system libgdal + version-matched bindings; PyPI gdal has no wheels)
        # Preinstalled numpy + --no-build-isolation: an isolated build omits the gdal_array
        # numpy bridge, which fails only at runtime (_gdal_array ImportError).
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgdal-dev
          pip install numpy setuptools wheel
          pip install "gdal==$(gdal-config --version)" --no-build-isolation

      - name: Install packages
        run: |
          pip install pytest-timeout pytest-xdist ruff
          pip install -e packages/tcip-annotation
          pip install -e "packages/tcip-mcp[dev,hpo]"
          pip install -e "packages/tcip-web[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        # TCIP_MIN_TESTS guards against the "missing dep silently skips ~15 files,
        # CI still green" mode; see tests/conftest.py and tests/test_core_deps.py.
        # -n auto: pytest-xdist parallelism (parallel-safe; scales to the runner's cores).
        # OMP_NUM_THREADS=1 pairs with the torch single-thread fixture so workers don't
        # oversubscribe. --timeout=300 caps thermal-throttle outliers without slowing the gate.
        env:
          TCIP_MIN_TESTS: "400"
          OMP_NUM_THREADS: "1"
        run: pytest tests/ -n auto --timeout=300 -q

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: packages/tcip-web/frontend
        run: npm ci --no-fund --no-audit

      - name: Format check
        working-directory: packages/tcip-web/frontend
        run: npm run format:check

      - name: Lint
        working-directory: packages/tcip-web/frontend
        run: npm run lint

      - name: Type check
        working-directory: packages/tcip-web/frontend
        run: npm run typecheck

      - name: Test
        working-directory: packages/tcip-web/frontend
        run: npm test

      - name: Build
        working-directory: packages/tcip-web/frontend
        run: npm run build
