# ============================================================
# TCIP Trait Catalog
# 180 canonical traits organized by pipeline configuration.
#
# Each group defines: image_perspective, sensor_type,
# isolation_task, ml_task.  Every trait in that group shares
# those four fields.  Non-automatable traits sit at the end.
# ============================================================

# aerial | lidar | point_cloud_analysis
aerial_lidar_point_cloud_analysis:
  image_perspective: aerial
  sensor_type: lidar
  isolation_task: instance_segmentation
  ml_task: point_cloud_analysis
  traits:
    - name: dbh
      definition: Diameter at breast height (4.5 feet above ground) in meters
      format: numeric
      category: morphology
      units: m
      crops: [black_locust, persimmon]
    - name: plant_biomass
      definition: Total above-ground biomass estimated from canopy volume via allometric equation
      format: numeric
      category: morphology
      units: kg
      crops: [hazelnut]
    - name: plant_height
      definition: Height of plant from crown to canopy top
      format: numeric
      category: morphology
      units: m
      crops: [black_locust, chestnut, currant, elderberry, hazelnut, persimmon]
    - name: plant_height_width_ratio
      definition: Ratio of height/width of the bush
      format: numeric
      category: morphology
      crops: [currant, elderberry]
    - name: plant_max_height
      definition: Plant height from crown to tallest point
      format: numeric
      category: morphology
      units: cm
      crops: [hazelnut]
    - name: plant_volume
      definition: 3-D crown volume
      format: numeric
      category: morphology
      crops: [chestnut, currant, elderberry, hazelnut]
    - name: stem_branching_frequency
      definition: Number of subdivisions per unit stem length
      format: numeric
      category: morphology
      crops: [hazelnut]
    - name: stem_vertical_angle
      definition: Change in branch angle before and after nut crop but before harvest
      format: numeric
      category: morphology
      crops: [hazelnut]

# aerial | multispectral | classification
aerial_multispectral_classification:
  image_perspective: aerial
  sensor_type: multispectral
  isolation_task: instance_segmentation
  ml_task: classification
  traits:
    - name: phytophthora_cinnamomi
      definition: Phytophthora root rot rating
      format: ordinal
      category: disease
      crops: [chestnut]

# aerial | rgb | change_detection
aerial_rgb_change_detection:
  image_perspective: aerial
  sensor_type: rgb
  isolation_task: instance_segmentation
  ml_task: change_detection
  traits:
    - name: bloom_05per_date
      definition: "Date when 5% of the bush's inflorescences have opened"
      format: date
      category: phenology
      crops: [currant, elderberry]
    - name: bloom_50per_date
      definition: Date of 50% bloom
      format: date
      category: phenology
      crops: [black_locust, currant, elderberry, persimmon]
    - name: bloom_95per_date
      definition: "Date when 95% of the bush's inflorescences have opened"
      format: date
      category: phenology
      crops: [currant, elderberry]
    - name: burr_drop_date
      definition: Date of burr drop
      format: date
      category: phenology
      crops: [chestnut]
    - name: catkin_bloom_date
      definition: Date of catkin bloom
      format: date
      category: phenology
      crops: [chestnut]
    - name: fruit_ripe_05per_date
      definition: "Date when 5% of the bush's fruit has ripened to eating stage"
      format: date
      category: phenology
      crops: [currant, elderberry]
    - name: fruit_ripe_50per_date
      definition: Date of 50% fruit ripe
      format: date
      category: phenology
      crops: [currant, elderberry, persimmon]
    - name: fruit_ripe_95per_date
      definition: "Date when 95% of the bush's fruit has ripened to eating stage"
      format: date
      category: phenology
      crops: [currant, elderberry]
    - name: leaf_out_05per_date
      definition: Date where 5% of leaves have unfurled from buds
      format: date
      category: phenology
      crops: [currant, elderberry]
    - name: leaf_out_50per_date
      definition: Date where 50% of leaves have unfurled from buds
      format: date
      category: phenology
      crops: [currant, elderberry]
    - name: leaf_senescence_95per_date
      definition: Date where 95% of leaves on plant have senesced
      format: date
      category: phenology
      crops: [currant, elderberry]

# aerial | rgb | classification
aerial_rgb_classification:
  image_perspective: aerial
  sensor_type: rgb
  isolation_task: instance_segmentation
  ml_task: classification
  traits:
    - name: bloom_frost_tolerance
      definition: Ordinal assessment of the damage to bloom after frost event
      format: ordinal
      category: disease
      crops: [currant, elderberry]
    - name: borer_damage
      definition: Ordinal rating of locust borer damage
      format: ordinal
      category: disease
      crops: [black_locust]
    - name: chestnut_anthracnose
      definition: Anthracnose disease rating
      format: ordinal
      category: disease
      crops: [chestnut]
    - name: cropload
      definition: Broad rating of total fruit production of tree
      format: ordinal
      category: yield
      crops: [persimmon]
    - name: efb_damage
      definition: 1-5 ordinal scale of EFB damage
      format: ordinal
      category: disease
      crops: [hazelnut]
    - name: efb_presence
      definition: Presence or absence of Eastern Filbert Blight cankers
      format: binary
      category: disease
      crops: [hazelnut]
    - name: fruit_drop
      definition: Proportion of ripe fruit that drop to ground (as opposed to being retained on the tree)
      format: ordinal
      category: yield
      crops: [persimmon]
    - name: fruit_sun_scorch
      definition: Ordinal assessment of the damage to fruit from sun scorch
      format: ordinal
      category: disease
      crops: [currant]
    - name: leaf_spot_presence
      definition: Ordinal gauge of the presence of leaf spot
      format: ordinal
      category: disease
      crops: [currant]
    - name: overall_disease
      definition: Broad rating of overall disease on the tree
      format: ordinal
      category: disease
      crops: [persimmon]
    - name: plant_borer
      definition: Ordinal assessment of the borer damage to the stem
      format: ordinal
      category: disease
      crops: [elderberry]
    - name: plant_dieback_presence
      definition: Ordinal assessment of cane dieback presence
      format: ordinal
      category: disease
      crops: [currant]
    - name: plant_eriophyid_mites
      definition: Ordinal assessment of presence and damage of eriophyid mite damage
      format: ordinal
      category: disease
      crops: [elderberry]
    - name: plant_growth_habit
      definition: Growth form classification
      format: nominal
      category: morphology
      crops: [black_locust, currant]
    - name: plant_jbeetle
      definition: Ordinal assessment of Japanese beetle presence (Popillia japonica) and damage
      format: ordinal
      category: disease
      crops: [elderberry]
    - name: plant_powderymildew_presence
      definition: Ordinal assessment of powdery mildew presence
      format: ordinal
      category: disease
      crops: [currant, elderberry]
    - name: plant_wpbr_presence
      definition: Ordinal assessment of white pine blister rust presence
      format: ordinal
      category: disease
      crops: [currant]
    - name: suckers
      definition: Ordinal rating of tree suckering
      format: ordinal
      category: morphology
      crops: [black_locust]

